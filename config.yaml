# RAG app configuration. Secrets (API keys) go in .env, never here.
# Point RAG_CONFIG at another file to run experiments (e.g. during eval).

paths:
  pdf_dir: data/pdfs
  storage_dir: storage          # Chroma DB + manifest live here
  log_dir: logs

parsing:
  # OCR runs only on pages whose extracted text is shorter than this AND ocr.enabled is true.
  ocr:
    enabled: true
    min_chars_before_ocr: 50
    language: eng
    dpi: 300
  extract_tables: true
  # A line is treated as a running header/footer if it sits in the top/bottom margin
  # (fraction of page height) and repeats on at least this fraction of pages.
  # 0.4 because papers alternate odd/even running heads (title vs. authors).
  header_footer_margin: 0.08
  header_footer_min_repeat: 0.4
  # Font size ratio vs. the document's body text above which a short line is a heading.
  heading_size_ratio: 1.15
  # Sections whose heading matches one of these (case-insensitive regex) are dropped.
  drop_sections:
    - "^(\\d+\\.?\\s*)?(references|bibliography|works cited)$"
    - "^(\\d+\\.?\\s*)?acknowledg(e)?ments?$"

chunking:
  # Tokens are estimated as chars / 4 (close enough for English with BERT-style tokenizers).
  chunk_size_tokens: 350
  chunk_overlap_tokens: 50
  min_chunk_tokens: 40          # smaller trailing fragments are merged into the previous chunk
  # Prepend "Doc title > Section" to the text that gets embedded; boosts retrieval a lot.
  add_context_header: true

embedding:
  provider: local               # local | voyage
  local:
    model: BAAI/bge-small-en-v1.5
    device: cpu                 # cpu | cuda
    batch_size: 32
    # bge v1.5 recommends this instruction for queries (not for documents).
    query_prefix: "Represent this sentence for searching relevant passages: "
  voyage:
    model: voyage-3.5
    batch_size: 64

vector_store:
  collection: papers

retrieval:
  vector_candidates: 30         # top-N from vector search
  bm25_candidates: 30           # top-N from BM25
  rrf_k: 60                     # Reciprocal Rank Fusion constant
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 30              # how many fused results go to the re-ranker
  top_k: 6                      # chunks finally sent to the LLM

generation:
  provider: ollama              # ollama (local, free, private) | groq | openai_compat (free APIs, need a key) | anthropic (API, needs key)
  history_turns: 3              # previous Q/A pairs used to rewrite follow-up questions
  max_tokens: 1000
  ollama:
    base_url: http://localhost:11434
    answer_model: qwen3:4b-instruct  # non-thinking build; plain "qwen3:4b" is the slow Thinking-2507 build
    rewrite_model: qwen3:4b-instruct  # rewriting follow-ups is easy; keep it small
    # Ollama's default context window is small and it silently truncates the prompt
    # when exceeded. 6 chunks x ~350 tokens + instructions needs ~3k; 8192 leaves headroom.
    num_ctx: 8192
    temperature: 0.0            # deterministic, least "creative" answers
    timeout_seconds: 300        # CPU generation is slow; first call also loads the model
  groq:                         # free tier at console.groq.com; used by the Streamlit Cloud deployment
    answer_model: llama-3.3-70b-versatile
    rewrite_model: llama-3.1-8b-instant
    temperature: 0.0
    max_retries: 4
    timeout_seconds: 60
  openai_compat:                # any OpenAI-compatible API; defaults to Google Gemini's free tier
    name: Gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY   # free key at https://aistudio.google.com/apikey
    answer_model: gemini-flash-latest       # alias that always points at the current Flash model
    rewrite_model: gemini-flash-lite-latest
    temperature: 0.0
    reasoning_effort: low       # Flash "thinks" first; low keeps answers fast
    max_retries: 4
    timeout_seconds: 90
  anthropic:
    answer_model: claude-sonnet-5
    rewrite_model: claude-haiku-4-5-20251001
    max_retries: 4              # SDK retries 429/5xx with exponential backoff
    timeout_seconds: 60

logging:
  level: INFO
